services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imbrace_platform
    ports:
      - "5432:5432"
    volumes:
      - platform-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-service:
    build: .
    container_name: platform
    ports:
      - "6040:6040"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imbrace_platform
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  platform-pgdata:
